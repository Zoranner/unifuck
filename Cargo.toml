[package]
name = "unifuck"
version = "0.1.0"
edition = "2021"

[dependencies]
roxmltree = "0.20"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
pem = "3"
anyhow = "1"
slint = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1"

[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"
winresource = "0.1"
